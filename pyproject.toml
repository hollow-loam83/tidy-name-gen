[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidyname"
version = "0.1.0"
description = "A formatter for messy human names, plus a random name generator built on it"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hollow-loam83" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["tidyname*"]
